name: Test release guards
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test release and repository guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check live upstream readiness without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/readiness.py
